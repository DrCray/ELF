<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomb-Sweeping Day in Taiwan: A Day of Family, Food, and Memories - Vocabulary Cards</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #f0f0f0;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #e94560;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
        }
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .vocab-card {
            background: linear-gradient(145deg, #2d2d44, #252536);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #39395a;
        }
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #e94560;
        }
        .card-closed {
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #e94560;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-open {
            padding: 0;
            display: none;
        }
        .card-header {
            background-color: #e94560;
            color: white;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
        }
        .card-content {
            padding: 15px;
        }
        .definition {
            margin-bottom: 15px;
            line-height: 1.6;
            color: #ccccdd;
        }
        .example {
            background-color: rgba(233, 69, 96, 0.1);
            border-left: 4px solid #e94560;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            line-height: 1.6;
            color: #aaccff;
        }
        .example-title {
            font-weight: bold;
            color: #e94560;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #ff5773;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #8888aa;
            font-size: 0.9rem;
        }
        .hint {
            text-align: center;
            margin-bottom: 20px;
            color: #8888aa;
            font-style: italic;
        }

}

}

    transform: translateY(-5px);

}
body.light-mode .card-closed {
    color: #1e40af;
}
body.light-mode .card-header {

}

    color: #1E40AF;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 20px;

}

    line-height: 1.65;
    font-size: 1.08rem;
    font-weight: 500;

}
body.light-mode .example-title {
    color: #1d4ed8;
}

    color: white;

body.light-mode button:hover {

}

}

</head>
<body>
    <h1>Tomb-Sweeping Day in Taiwan: A Day of Family, Food, and Memories Vocabulary Cards</h1>
    <div class="hint">Click on any card to reveal the definition and example. Click again to close it.</div>

    <div class="controls">
        <button id="openAll">Open All Cards</button>
        <button id="closeAll">Close All Cards</button>
        <button id="themeToggle">Switch to Dark Mode</button>
    </div>

    <div class="cards-container" id="cardsContainer">
        <!-- Cards will be generated by JavaScript -->
    </div>

    <footer>
        Vocabulary extracted from "Tomb-Sweeping Day in Taiwan: A Day of Family, Food, and Memories" text | Created for learning purposes
    </footer>

    <script>
        const vocabulary = [
  {
    "word": "graves",

    "example": "The old cemetery was filled with graves dating back over a century."
  },
  {
    "word": "ancestors",
    "definition": "Family members who lived a long time ago, before your grandparents.",
    "example": "She traced her ancestors back to a small fishing village in Ireland."
  },
  {
    "word": "passed away",
    "definition": "A polite way of saying someone has died.",
    "example": "His grandmother passed away peacefully in her sleep last winter."
  },
  {
    "word": "reunion",
    "definition": "A gathering of people, such as family or friends, who have been apart for a while.",
    "example": "The whole family flew in from different countries for the reunion."
  },
  {
    "word": "heading",
    "definition": "Moving or traveling in a particular direction.",
    "example": "We were heading toward the coast when the storm hit."
  },
  {
    "word": "cemetery",
    "definition": "A place where dead people are buried.",
    "example": "The town's cemetery sits on a quiet hill overlooking the river."
  },
  {
    "word": "weeds",
    "definition": "Wild plants that grow where they are not wanted, often among crops or grass.",
    "example": "After a month of rain, weeds had taken over the garden."
  },
  {
    "word": "showing respect",
    "definition": "Behaving in a way that honors or values someone or something.",
    "example": "Bowing before the elder was his way of showing respect."
  },
  {
    "word": "offering",
    "definition": "Something given, especially as part of a religious or ceremonial act.",
    "example": "Villagers left an offering of rice and fruit at the shrine."
  },
  {
    "word": "mirror image",
    "definition": "An exact reverse copy or reflection of something.",
    "example": "The calm lake created a perfect mirror image of the mountains."
  },
  {
    "word": "nourishment",
    "definition": "Food or substances necessary for growth, health, and good condition.",
    "example": "The doctor said the patient needed more nourishment to recover fully."
  },
  {
    "word": "symbolic",
    "definition": "Representing or standing for something else, often with deeper meaning.",
    "example": "Releasing the doves was a symbolic gesture of peace."
  },
  {
    "word": "ritual",
    "definition": "A set of actions performed in a fixed order, often as part of a ceremony.",
    "example": "Lighting a candle every evening had become a comforting ritual for her."
  },
  {
    "word": "reuniting",
    "definition": "Coming together again after being apart.",
    "example": "The old friends spent hours reuniting over coffee and old photos."
  },
  {
    "word": "customizable",
    "definition": "Able to be changed or adjusted to suit a person's own preferences.",
    "example": "The new phone case comes in a fully customizable design."
  },
  {
    "word": "burrito",
    "definition": "A Mexican dish of a flour tortilla rolled around a filling of meat, beans, or vegetables.",
    "example": "He ordered a chicken burrito with extra salsa for lunch."
  },
  {
    "word": "crepe",
    "definition": "A very thin, soft pancake, often used to wrap or hold other foods.",
    "example": "She spread strawberry jam over the warm crepe before folding it."
  },
  {
    "word": "overlapping",
    "definition": "Partly covering something else, or partly happening at the same time.",
    "example": "The two meetings ended up overlapping, so she could only attend one."
  },
  {
    "word": "stacked",
    "definition": "Arranged in a neat pile, one on top of another.",
    "example": "Clean towels were stacked neatly on the shelf."
  },
  {
    "word": "laid out",
    "definition": "Arranged or spread out in a clear, organized way.",
    "example": "The tools were laid out on the table before the repair began."
  },
  {
    "word": "preferences",
    "definition": "The things a person likes better than others, or chooses over alternatives.",
    "example": "The restaurant let guests choose toppings based on their own preferences."
  },
  {
    "word": "flavorings",
    "definition": "Substances added to food or drink to give it a particular taste.",
    "example": "The recipe called for vanilla and other natural flavorings."
  },
  {
    "word": "consistency",
    "definition": "The thickness, texture, or physical state of a substance.",
    "example": "The sauce needed to simmer longer to reach the right consistency."
  },
  {
    "word": "sprinkle",
    "definition": "A small amount of something scattered on top of something else.",
    "example": "She added a sprinkle of cinnamon to her morning coffee."
  },
  {
    "word": "amusement",
    "definition": "A feeling of finding something funny or entertaining.",
    "example": "The children watched the puppet show with wide-eyed amusement."
  },
  {
    "word": "passed",
    "definition": "Died; used as a shorter, informal version of 'passed away.'",
    "example": "It had been five years since his father passed."
  }
];

        function createCards() {
            const container = document.getElementById('cardsContainer');

            vocabulary.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.dataset.word = item.word;

                const closedDiv = document.createElement('div');
                closedDiv.className = 'card-closed';
                closedDiv.textContent = item.word;

                const openDiv = document.createElement('div');
                openDiv.className = 'card-open';

                const header = document.createElement('div');
                header.className = 'card-header';
                header.textContent = item.word;

                const content = document.createElement('div');
                content.className = 'card-content';

                const definition = document.createElement('div');
                definition.className = 'definition';
                definition.innerHTML = `<strong>Definition:</strong> ${item.definition}`;

                const example = document.createElement('div');
                example.className = 'example';
                example.innerHTML = `<div class="example-title">Example</div>${item.example}`;

                content.appendChild(definition);
                content.appendChild(example);

                openDiv.appendChild(header);
                openDiv.appendChild(content);

                card.appendChild(closedDiv);
                card.appendChild(openDiv);

                card.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;

                    const isOpen = this.querySelector('.card-open').style.display === 'block';

                    if (isOpen) {
                        this.querySelector('.card-open').style.display = 'none';
                        this.querySelector('.card-closed').style.display = 'flex';
                    } else {
                        this.querySelector('.card-open').style.display = 'block';
                        this.querySelector('.card-closed').style.display = 'none';
                    }
                });

                container.appendChild(card);
            });
        }

        function openAllCards() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.querySelector('.card-open').style.display = 'block';
                card.querySelector('.card-closed').style.display = 'none';
            });
        }

        function closeAllCards() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.querySelector('.card-open').style.display = 'none';
                card.querySelector('.card-closed').style.display = 'flex';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            createCards();

            document.getElementById('openAll').addEventListener('click', openAllCards);
            document.getElementById('closeAll').addEventListener('click', closeAllCards);
        });
    </script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const body = document.body;
    const toggleBtn = document.getElementById('themeToggle');

    body.classList.add('light-mode');
    toggleBtn.textContent = 'Switch to Dark Mode';

    toggleBtn.addEventListener('click', function() {
        if (body.classList.contains('light-mode')) {
            body.classList.remove('light-mode');
            body.classList.add('dark-mode');
            toggleBtn.textContent = 'Switch to Light Mode';
        } else {
            body.classList.remove('dark-mode');
            body.classList.add('light-mode');
            toggleBtn.textContent = 'Switch to Dark Mode';
        }
    });
});
</script>
</body>
</html>
