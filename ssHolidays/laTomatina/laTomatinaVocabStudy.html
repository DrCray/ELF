<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Tomatina: The World's Messiest Festival - Vocabulary Cards</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #f0f0f0;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #e94560;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
        }
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .vocab-card {
            background: linear-gradient(145deg, #2d2d44, #252536);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #39395a;
        }
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #e94560;
        }
        .card-closed {
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #e94560;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-open {
            padding: 0;
            display: none;
        }
        .card-header {
            background-color: #e94560;
            color: white;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
        }
        .card-content {
            padding: 15px;
        }
        .definition {
            margin-bottom: 15px;
            line-height: 1.6;
            color: #ccccdd;
        }
        .example {
            background-color: rgba(233, 69, 96, 0.1);
            border-left: 4px solid #e94560;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            line-height: 1.6;
            color: #aaccff;
        }
        .example-title {
            font-weight: bold;
            color: #e94560;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #ff5773;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #8888aa;
            font-size: 0.9rem;
        }
        .hint {
            text-align: center;
            margin-bottom: 20px;
            color: #8888aa;
            font-style: italic;
        }
body.light-mode {
    background-color: #f8f9fa;
    color: #1d1d1f;
}
body.light-mode h1 {
    color: #1e40af;
    text-shadow: 0 0 8px rgba(30, 64, 175, 0.25);
}
body.light-mode .vocab-card {
    background: linear-gradient(145deg, #ffffff, #f0f5ff);
    border: 1px solid #dbeafe;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}
body.light-mode .vocab-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    border-color: #3b82f6;
}
body.light-mode .card-closed {
    color: #1e40af;
}
body.light-mode .card-header {
    background-color: #1e40af;
    color: white;
}
body.light-mode .definition {
    color: #1E40AF;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 20px;
    background-color: rgba(59, 130, 246, 0.10);
    padding: .2rem .3rem;
    border-radius: 0 10px 10px 0;
    border-left: 5px solid #3b82f6;
}
body.light-mode .example {
    border-left: 5px solid #3b82f6;
    padding: 16px 18px 16px 22px;
    border-radius: 0 10px 10px 0;
    color: #1e293b;
    line-height: 1.65;
    font-size: 1.08rem;
    font-weight: 500;
    margin: 16px 0;
}
body.light-mode .example-title {
    color: #1d4ed8;
}
body.light-mode button {
    background-color: #1d4ed8;
    color: white;
}
body.light-mode button:hover {
    background-color: #3b82f6;
}
body.light-mode .hint,
body.light-mode footer {
    color: #4b5563;
}
body.dark-mode {
    background-color: #1a1a2e;
    color: #f0f0f0;
}
body.dark-mode h1 {
    color: #e94560;
    text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
}
    </style>
</head>
<body>
    <h1>La Tomatina: The World's Messiest Festival Vocabulary Cards</h1>
    <div class="hint">Click on any card to reveal the definition and example. Click again to close it.</div>

    <div class="controls">
        <button id="openAll">Open All Cards</button>
        <button id="closeAll">Close All Cards</button>
        <button id="themeToggle">Switch to Dark Mode</button>
    </div>

    <div class="cards-container" id="cardsContainer">
        <!-- Cards will be generated by JavaScript -->
    </div>

    <footer>
        Vocabulary extracted from "La Tomatina: The World's Messiest Festival" text | Created for learning purposes
    </footer>

    <script>
        const vocabulary = [
  {
    "word": "ripe",
    "definition": "(of fruit) fully developed and ready to eat.",
    "example": "The bananas on the counter are finally ripe enough to eat."
  },
  {
    "word": "held",
    "definition": "Took place; was organized (used for events).",
    "example": "The annual music festival is held every summer in the park."
  },
  {
    "word": "enormous",
    "definition": "Very large in size or amount.",
    "example": "The construction crew left an enormous pile of rubble in the parking lot."
  },
  {
    "word": "protect",
    "definition": "To keep someone or something safe from harm.",
    "example": "Cyclists should always wear a helmet to protect their head."
  },
  {
    "word": "goggles",
    "definition": "Protective glasses that fit closely around the eyes.",
    "example": "Swimmers often wear goggles to keep chlorine out of their eyes."
  },
  {
    "word": "covered",
    "definition": "Having a layer of something spread over the surface.",
    "example": "After the storm, the entire yard was covered in fallen leaves."
  },
  {
    "word": "take part",
    "definition": "To participate in an activity or event.",
    "example": "Hundreds of runners took part in the charity marathon last weekend."
  },
  {
    "word": "piles",
    "definition": "Stacks or heaps of things placed on top of one another.",
    "example": "There were piles of unwashed laundry sitting by the door."
  },
  {
    "word": "building",
    "definition": "Increasing gradually in strength or intensity.",
    "example": "The tension in the room kept building as the meeting went on."
  },
  {
    "word": "thigh",
    "definition": "The part of the leg between the hip and the knee.",
    "example": "He pulled a muscle in his thigh during the soccer match."
  },
  {
    "word": "react",
    "definition": "To respond to something that happens.",
    "example": "She didn't know how to react when she heard the surprising news."
  },
  {
    "word": "flew past",
    "definition": "Moved quickly by, often through the air.",
    "example": "A frisbee flew past my head just as I turned around."
  },
  {
    "word": "reached for",
    "definition": "Stretched out a hand in order to touch or take something.",
    "example": "He reached for his phone the moment it started ringing."
  },
  {
    "word": "caught up",
    "definition": "Became fully involved or absorbed in something.",
    "example": "She got so caught up in the movie that she forgot to eat dinner."
  },
  {
    "word": "madness",
    "definition": "Wild, chaotic, or extremely foolish behavior.",
    "example": "The last-minute holiday shopping crowds were total madness."
  },
  {
    "word": "scoop up",
    "definition": "To lift or gather something with a sweeping motion, often using the hands.",
    "example": "The toddler tried to scoop up the sand with both hands."
  },
  {
    "word": "over",
    "definition": "Finished; at an end.",
    "example": "By the time we arrived at the theater, the movie was already over."
  },
  {
    "word": "looked around",
    "definition": "Turned one's head or eyes to observe the surrounding area.",
    "example": "She looked around the empty classroom before turning off the lights."
  },
  {
    "word": "recognize",
    "definition": "To identify someone or something because you have seen or known them before.",
    "example": "I almost didn't recognize my old classmate after so many years."
  },
  {
    "word": "pulp",
    "definition": "The soft, wet, fleshy part of a fruit or vegetable.",
    "example": "She strained the juice to remove all the orange pulp."
  },
  {
    "word": "slippery",
    "definition": "Smooth or wet, making it difficult to hold onto or stand on.",
    "example": "Be careful, the bathroom floor is still slippery from the shower."
  },
  {
    "word": "running down",
    "definition": "Flowing downward in a continuous stream.",
    "example": "Sweat was running down his face after the long uphill run."
  },
  {
    "word": "exhausted",
    "definition": "Extremely tired; drained of energy.",
    "example": "After the twelve-hour flight, she was completely exhausted."
  },
  {
    "word": "unforgettable",
    "definition": "Impossible to forget; leaving a strong, lasting impression.",
    "example": "Watching the northern lights for the first time was unforgettable."
  },
  {
    "word": "messy",
    "definition": "Untidy, disorganized, or dirty.",
    "example": "His desk gets messy every week no matter how often he cleans it."
  }
];

        function createCards() {
            const container = document.getElementById('cardsContainer');

            vocabulary.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.dataset.word = item.word;

                const closedDiv = document.createElement('div');
                closedDiv.className = 'card-closed';
                closedDiv.textContent = item.word;

                const openDiv = document.createElement('div');
                openDiv.className = 'card-open';

                const header = document.createElement('div');
                header.className = 'card-header';
                header.textContent = item.word;

                const content = document.createElement('div');
                content.className = 'card-content';

                const definition = document.createElement('div');
                definition.className = 'definition';
                definition.innerHTML = `<strong>Definition:</strong> ${item.definition}`;

                const example = document.createElement('div');
                example.className = 'example';
                example.innerHTML = `<div class="example-title">Example</div>${item.example}`;

                content.appendChild(definition);
                content.appendChild(example);

                openDiv.appendChild(header);
                openDiv.appendChild(content);

                card.appendChild(closedDiv);
                card.appendChild(openDiv);

                card.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;

                    const isOpen = this.querySelector('.card-open').style.display === 'block';

                    if (isOpen) {
                        this.querySelector('.card-open').style.display = 'none';
                        this.querySelector('.card-closed').style.display = 'flex';
                    } else {
                        this.querySelector('.card-open').style.display = 'block';
                        this.querySelector('.card-closed').style.display = 'none';
                    }
                });

                container.appendChild(card);
            });
        }

        function openAllCards() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.querySelector('.card-open').style.display = 'block';
                card.querySelector('.card-closed').style.display = 'none';
            });
        }

        function closeAllCards() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.querySelector('.card-open').style.display = 'none';
                card.querySelector('.card-closed').style.display = 'flex';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            createCards();

            document.getElementById('openAll').addEventListener('click', openAllCards);
            document.getElementById('closeAll').addEventListener('click', closeAllCards);
        });
    </script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const body = document.body;
    const toggleBtn = document.getElementById('themeToggle');

    body.classList.add('light-mode');
    toggleBtn.textContent = 'Switch to Dark Mode';

    toggleBtn.addEventListener('click', function() {
        if (body.classList.contains('light-mode')) {
            body.classList.remove('light-mode');
            body.classList.add('dark-mode');
            toggleBtn.textContent = 'Switch to Light Mode';
        } else {
            body.classList.remove('dark-mode');
            body.classList.add('light-mode');
            toggleBtn.textContent = 'Switch to Dark Mode';
        }
    });
});
</script>
</body>
</html>
