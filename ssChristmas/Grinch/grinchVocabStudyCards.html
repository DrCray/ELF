<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Study · How the Grinch Stole Christmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #f1e9d2;
    --paper: #faf4e3;
    --paper-2: #f6eed8;
    --ink: #1a2820;
    --ink-soft: #4a5a4a;
    --ink-mute: #7a8576;
    --green: #1d4d2e;
    --green-deep: #0c2b1a;
    --green-soft: #2d5d3e;
    --red: #842020;
    --gold: #a8742a;
    --gold-light: #c89a3e;
    --cream: #fdf8eb;
    --border: rgba(29, 77, 46, 0.18);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    min-height: 100vh;
    line-height: 1.6;
    background-image:
      radial-gradient(ellipse 60% 50% at 15% 0%, rgba(168, 116, 42, 0.12) 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 85% 100%, rgba(132, 32, 32, 0.08) 0%, transparent 55%),

  }
  .display { font-family: 'Cormorant Garamond', serif; }

  /* Hero decorative SVGs */
  .hero-deco { position: absolute; pointer-events: none; color: var(--green); opacity: 0.12; }

  /* Ornament divider */
  .ornament-deco { display: flex; align-items: center; justify-content: center; gap: 14px; color: var(--gold); }
  .ornament-deco .line { height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); flex: 1; max-width: 100px; }

  /* Sticky bar */
  .sticky-bar {
    background: linear-gradient(180deg, rgba(241, 233, 210, 0.96), rgba(241, 233, 210, 0.86));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .search-wrap { position: relative; flex: 1; max-width: 360px; min-width: 200px; }
  .search-input {
    background: rgba(253, 248, 235, 0.7);
    border: 1px solid var(--border);
    padding: 11px 18px 11px 42px;
    border-radius: 100px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    width: 100%;
    transition: all 0.25s;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--green);
    background: var(--cream);
    box-shadow: 0 0 0 4px rgba(29, 77, 46, 0.10);
  }
  .search-input::placeholder { color: var(--ink-mute); }

  .filter-pill {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 100px;
    background: transparent;
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .filter-pill:hover { border-color: var(--green); color: var(--green); }
  .filter-pill.active { background: var(--green); border-color: var(--green); color: var(--cream); }

  /* Progress */
  .progress-track {
    height: 5px;
    background: rgba(29, 77, 46, 0.15);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-soft), var(--green));
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    border-radius: 100px;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shimmer 2.5s linear infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  /* Stats */
  .stat-pill {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    padding: 7px 16px;
    background: rgba(168, 116, 42, 0.09);
    border: 1px solid rgba(168, 116, 42, 0.20);
    border-radius: 100px;
  }
  .stat-pill .num {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--green-deep);
    line-height: 1;
  }
  .stat-pill .lbl {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 22px;
  }

  .vocab-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 26px 24px;
    position: relative;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 1px 2px rgba(12, 43, 26, 0.04), 0 4px 12px rgba(12, 43, 26, 0.04);
    overflow: hidden;
  }
  .vocab-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    opacity: 0.75;
    transition: opacity 0.4s;
  }
  .vocab-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 1px 2px rgba(12, 43, 26, 0.04), 0 22px 44px rgba(12, 43, 26, 0.14);
    border-color: rgba(29, 77, 46, 0.32);
  }
  .vocab-card:hover::before { opacity: 1; }
  .vocab-card.learned {
    background: linear-gradient(170deg, #e8efe2 0%, #dde8d4 100%);
    border-color: rgba(29, 77, 46, 0.35);
  }
  .vocab-card.learned::before {
    background: linear-gradient(180deg, var(--green-soft), var(--green));
  }

  .pos-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(168, 116, 42, 0.10);
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid rgba(168, 116, 42, 0.18);
  }
  .word-display {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(1.85rem, 3.5vw, 2.4rem);
    line-height: 1.05;
    color: var(--green-deep);
    margin: 12px 0 0;
    letter-spacing: -0.01em;
  }
  .definition {
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    padding: 14px 0;
    border-top: 1px solid rgba(29, 77, 46, 0.15);
    border-bottom: 1px solid rgba(29, 77, 46, 0.15);
    margin: 16px 0 14px;
  }
  .micro-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 6px;
  }
  .example {
    display: flex;
    gap: 10px;
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.55;
    margin: 8px 0;
  }
  .example-number {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--green);
    color: var(--cream);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .highlight-word {
    background: linear-gradient(180deg, transparent 55%, rgba(200, 154, 62, 0.45) 55%);
    padding: 0 3px;
    font-weight: 600;
    color: var(--green-deep);
  }
  .learn-btn {
    position: absolute;
    top: 20px; right: 20px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid rgba(29, 77, 46, 0.3);
    background: rgba(253, 248, 235, 0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    padding: 0;
  }
  .learn-btn:hover {
    border-color: var(--green);
    background: rgba(29, 77, 46, 0.08);
    transform: scale(1.08);
  }
  .learn-btn svg { opacity: 0; transition: opacity 0.3s; color: var(--cream); }
  .vocab-card.learned .learn-btn {
    background: var(--green);
    border-color: var(--green);
  }
  .vocab-card.learned .learn-btn svg { opacity: 1; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-mute);
  }

  @media (max-width: 768px) {
    .sticky-bar-content { flex-direction: column; gap: 12px; align-items: stretch; }
    .filter-row { justify-content: center; }
  }
</style>
</head>

<section class="sticky top-0 z-30 sticky-bar">

        <button class="filter-pill active" data-filter="all">All</button>

  </div>
</section>

<main class="max-w-6xl mx-auto px-6 lg:px-10 py-10">

  <div id="emptyState" class="empty-state hidden">

</main>

    { wordId: 23, index: 2, sentence: "The wooden carving on the door told stories of ancient times and forgotten heroes." }
  ];

  // ====================================================================
  //  STATE & LOGIC
  // ====================================================================
  const learnedState = {};
  let currentFilter = 'all';
  let currentSearch = '';

  const getDefinition = (wordId) => definitions.find(d => d.wordId === wordId);
  const getSentences = (wordId) => sentences
    .filter(s => s.wordId === wordId)
    .sort((a, b) => a.index - b.index);

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Highlight the study word inside an example sentence
  function highlightWord(sentence, word) {
    const wordLower = word.toLowerCase();
    const sentenceLower = sentence.toLowerCase();
    const idx = sentenceLower.indexOf(wordLower);
    if (idx === -1) return escapeHtml(sentence);
    const before = sentence.substring(0, idx);
    const match  = sentence.substring(idx, idx + word.length);
    const after  = sentence.substring(idx + word.length);
    return escapeHtml(before)
      + '<span class="highlight-word">' + escapeHtml(match) + '</span>'
      + escapeHtml(after);
  }

  function renderCards() {
    const grid = document.getElementById('cardGrid');
    const empty = document.getElementById('emptyState');
    grid.innerHTML = '';
    let visibleCount = 0;

    words.forEach(w => {
      const def = getDefinition(w.id);
      const exs = getSentences(w.id);
      const isLearned = !!learnedState[w.id];

      // Filter
      if (currentFilter === 'learned' && !isLearned) return;
      if (currentFilter === 'unlearned' && isLearned) return;

      // Search across word, POS, definition, and example sentences
      if (currentSearch) {
        const haystack = (
          w.word + ' ' +
          w.partOfSpeech + ' ' +
          def.definition + ' ' +
          exs.map(e => e.sentence).join(' ')
        ).toLowerCase();
        if (!haystack.includes(currentSearch)) return;
      }

      visibleCount++;
      const card = document.createElement('article');
      card.className = 'vocab-card fade-up' + (isLearned ? ' learned' : '');
      card.style.animationDelay = Math.min(visibleCount * 0.04, 0.5) + 's';

      const sentencesHtml = exs.map(e => `
        <div class="example">
          <div class="example-number">${e.index}</div>
          <div>${highlightWord(e.sentence, w.word)}</div>
        </div>
      `).join('');

      card.innerHTML = `
        <button class="learn-btn" data-word-id="${w.id}" aria-label="${isLearned ? 'Mark as not learned' : 'Mark as learned'}" title="${isLearned ? 'Mark as not learned' : 'Mark as learned'}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
        <span class="pos-tag">${escapeHtml(w.partOfSpeech)}</span>
        <h2 class="word-display">${escapeHtml(w.word)}</h2>
        <div class="definition">
          <span class="micro-label">Definition</span>
          ${escapeHtml(def.definition)}
        </div>
        <div>
          <span class="micro-label">In Context</span>
          ${sentencesHtml}
        </div>
      `;
      grid.appendChild(card);
    });

    empty.classList.toggle('hidden', visibleCount > 0);
    updateProgress();
  }

  function updateProgress() {
    const total = words.length;
    const learned = Object.keys(learnedState).filter(k => learnedState[k]).length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('learnedCount').textContent = learned;
    document.getElementById('progressFill').style.width = (learned / total * 100) + '%';
  }

  // Events
  document.addEventListener('click', e => {
    const btn = e.target.closest('.learn-btn');
    if (btn) {
      const id = parseInt(btn.dataset.wordId);
      if (learnedState[id]) delete learnedState[id];
      else learnedState[id] = true;
      renderCards();
    }
    const pill = e.target.closest('.filter-pill');
    if (pill) {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      currentFilter = pill.dataset.filter;
      renderCards();
    }
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    currentSearch = e.target.value.trim().toLowerCase();
    renderCards();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    Object.keys(learnedState).forEach(k => delete learnedState[k]);
    renderCards();
  });

  // Initial render
  renderCards();
</script>

</body>
</html>
