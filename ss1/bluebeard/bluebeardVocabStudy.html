<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluebeard — Vocabulary Study Cards</title>
    <style>
        /* Base styles */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: #f8fafc;
            color: #1e293b;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .page-container {
            width: 100%;
            max-width: 64rem;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .eyebrow {
            margin: 0 0 .25rem;
            color: #4f46e5;
            font-size: .75rem;
            line-height: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        h1 {
            margin: 0;
            color: #0f172a;
            font-size: 1.5rem;
            line-height: 2rem;
            font-weight: 700;
            letter-spacing: -.025em;
        }

        .intro {
            margin: .25rem 0 0;
            color: #64748b;
            font-size: .875rem;
            line-height: 1.25rem;
        }

        .print-button {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: .625rem 1rem;
            border: 0;
            border-radius: .75rem;
            background: #4f46e5;
            color: #fff;
            font: 500 .875rem/1.25rem inherit;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05);
            transition: background-color .15s ease;
        }

        .print-button:hover { background: #4338ca; }
        .print-button:active { background: #3730a3; }
        .print-button:focus-visible {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
            box-shadow: 0 0 0 2px #fff;
        }
        .print-button svg { width: 1rem; height: 1rem; }

        .study-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 1.5rem;
        }

        .study-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            border: 1px solid rgb(226 232 240 / .9);
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05);
            transition: box-shadow .15s ease;
        }

        .study-card:hover { box-shadow: 0 4px 6px -1px rgb(0 0 0 / .1), 0 2px 4px -2px rgb(0 0 0 / .1); }

        .card-heading {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin-bottom: .75rem;
        }

        .number-badge {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            border: 1px solid #e0e7ff;
            border-radius: .5rem;
            background: #eef2ff;
            color: #4338ca;
            font-size: .75rem;
            line-height: 1rem;
            font-weight: 700;
        }

        .card-heading h2 {
            margin: 0;
            color: #0f172a;
            font-size: 1.25rem;
            line-height: 1.75rem;
            font-weight: 700;
            letter-spacing: -.025em;
        }

        .definition {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .section-label {
            display: block;
            margin-bottom: .25rem;
            color: #94a3b8;
            font-size: .75rem;
            line-height: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .definition p {
            margin: 0;
            color: #334155;
            font-size: 1rem;
            line-height: 1.625;
            font-weight: 500;
        }

        .examples-label { margin-bottom: .5rem; }

        .examples-list {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            margin: 0;
            padding: 0;
            list-style: none;
            color: #475569;
            font-size: .875rem;
            line-height: 1.25rem;
        }

        .examples-list li {
            display: flex;
            align-items: flex-start;
            gap: .5rem;
        }

        .bullet {
            flex: none;
            color: #6366f1;
            font-weight: 700;
            user-select: none;
        }

        .example-text { line-height: 1.625; }

        .page-footer {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            text-align: center;
            font-size: .75rem;
            line-height: 1rem;
        }

        @media (min-width: 640px) {
            body { padding-right: 1.5rem; padding-left: 1.5rem; }
            .page-header {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            h1 { font-size: 1.875rem; line-height: 2.25rem; }
        }

        @media (min-width: 768px) {
            .study-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (min-width: 1024px) {
            body { padding-right: 2rem; padding-left: 2rem; }
        }

        /* Print-specific optimizations */
        @media print {
            body {
                padding: 0 !important;
                background: #fff !important;
                color: #000 !important;
            }
            .no-print { display: none !important; }
            .study-grid {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 1rem !important;
            }
            .study-card {
                break-inside: avoid;
                page-break-inside: avoid;
                padding: 1rem !important;
                border: 1px solid #cbd5e1 !important;
                background: #fff !important;
                box-shadow: none !important;
            }
            .page-header {
                margin-bottom: 1.25rem !important;
                padding-bottom: .75rem !important;
                border-bottom: 2px solid #e2e8f0 !important;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <div>
                <p class="eyebrow">Student Study Guide</p>
                <h1>Bluebeard — Vocabulary Study Cards</h1>
                <p class="intro">Review each word, its definition in context, and two example sentences.</p>
            </div>

            <div class="no-print">
                <button class="print-button" id="print-button" type="button" aria-label="Print Study Guide">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    Print Study Guide
                </button>
            </div>
        </header>

        <main id="cards-container" class="study-grid">
            <!-- Study cards are inserted by JavaScript. -->
        </main>

        <footer class="page-footer">
            Vocabulary Study Guide • 11 Key Words from &ldquo;Bluebeard&rdquo;
        </footer>
    </div>

    <script>
        const vocabularyData = [
            {
                number: 1,
                word: "Splendid",
                definition: "Magnificent, very impressive, or grand.",
                examples: [
                    "The king wore a splendid cloak made of velvet and gold thread.",
                    "We had a splendid view of the ocean from our hotel balcony."
                ]
            },
            {
                number: 2,
                word: "Diseases",
                definition: "Illnesses or sicknesses that affect people, animals, or plants.",
                examples: [
                    "Modern medicine has helped wipe out many dangerous diseases.",
                    "Washing your hands frequently helps prevent the spread of infectious diseases."
                ]
            },
            {
                number: 3,
                word: "Bizarre",
                definition: "Very unusual, strange, or odd.",
                examples: [
                    "We heard a bizarre noise coming from the attic in the middle of the night.",
                    "The movie had a bizarre plot that left everyone confused at the end."
                ]
            },
            {
                number: 4,
                word: "Bunch",
                definition: "A collection of things of the same kind held or grouped together.",
                examples: [
                    "She bought a fresh bunch of bananas from the local market.",
                    "He handed me a large bunch of keys to open all the storage rooms."
                ]
            },
            {
                number: 5,
                word: "Instructions",
                definition: "Detailed directions or orders on how to do or use something.",
                examples: [
                    "Please read the assembly instructions carefully before building the desk.",
                    "The teacher gave clear instructions on how to complete the science project."
                ]
            },
            {
                number: 6,
                word: "Forbidden",
                definition: "Not allowed or strictly prohibited by rule, law, or authority.",
                examples: [
                    "Entering the construction site without a hard hat is strictly forbidden.",
                    "Eating candy before dinner was forbidden in her house."
                ]
            },
            {
                number: 7,
                word: "Curiosity",
                definition: "A strong desire to know or learn about something.",
                examples: [
                    "Out of pure curiosity, she looked inside the mysterious wrapped box.",
                    "Children often ask many questions because of their natural curiosity about the world."
                ]
            },
            {
                number: 8,
                word: "Discovered",
                definition: "Found something hidden, unknown, or unexpected.",
                examples: [
                    "The scientists discovered a new species of frog deep in the rainforest.",
                    "When I opened the dusty drawer, I discovered my long-lost childhood diary."
                ]
            },
            {
                number: 9,
                word: "Burst",
                definition: "To break open, split, or fly apart suddenly and with force.",
                examples: [
                    "The water balloon grew too large and finally burst with a loud pop.",
                    "Strong winds caused the old wooden door to burst open during the storm."
                ]
            },
            {
                number: 10,
                word: "Property",
                definition: "Land, buildings, or possessions owned by someone.",
                examples: [
                    "Walking onto private property without permission is against the law.",
                    "They invested a lot of money into buying residential property downtown."
                ]
            },
            {
                number: 11,
                word: "Wealth",
                definition: "A large amount of valuable possessions, money, or resources.",
                examples: [
                    "He accumulated great wealth through his successful technology business.",
                    "True wealth is measured not just in money, but in health, family, and happiness."
                ]
            }
        ];

        // Build the study cards.
        function renderStudyCards() {
            const container = document.getElementById("cards-container");
            if (!container) return;

            container.innerHTML = vocabularyData.map(item => `
                <article class="study-card">
                    <div>
                        <div class="card-heading">
                            <span class="number-badge">${item.number}</span>
                            <h2>${item.word}</h2>
                        </div>

                        <div class="definition">
                            <span class="section-label">Definition</span>
                            <p>${item.definition}</p>
                        </div>
                    </div>

                    <div>
                        <span class="section-label examples-label">Examples</span>
                        <ul class="examples-list">
                            <li>
                                <span class="bullet" aria-hidden="true">&bull;</span>
                                <span class="example-text">${item.examples[0]}</span>
                            </li>
                            <li>
                                <span class="bullet" aria-hidden="true">&bull;</span>
                                <span class="example-text">${item.examples[1]}</span>
                            </li>
                        </ul>
                    </div>
                </article>
            `).join("");
        }

        document.getElementById("print-button").addEventListener("click", () => window.print());
        document.addEventListener("DOMContentLoaded", renderStudyCards);
    </script>
</body>
</html>
