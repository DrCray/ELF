<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluebeard — Vocabulary Study Cards</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Print-specific optimizations to ensure clean pagination and ink-friendly output */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .study-grid {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 1rem !important;
            }
            .study-card {
                break-inside: avoid;
                page-break-inside: avoid;
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                background-color: #ffffff !important;
                padding: 1rem !important;
            }
            header {
                margin-bottom: 1.25rem !important;
                padding-bottom: 0.75rem !important;
                border-bottom: 2px solid #e2e8f0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <!-- Main Container -->
    <div class="max-w-5xl mx-auto">
        
        <!-- Header Section -->
        <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-6 mb-8 border-b border-slate-200">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-indigo-600 mb-1">Student Study Guide</p>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Bluebeard — Vocabulary Study Cards</h1>
                <p class="text-sm text-slate-500 mt-1">Review each word, its definition in context, and two example sentences.</p>
            </div>
            
            <!-- Print Button (Hidden when printing) -->
            <div class="no-print shrink-0">
                <button 
                    onclick="window.print()" 
                    class="inline-flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-sm font-medium rounded-xl shadow-sm transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
                    aria-label="Print Study Guide"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    Print Study Guide
                </button>
            </div>
        </header>

        <!-- Responsive Grid of Study Cards -->
        <main id="cards-container" class="study-grid grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Cards are rendered cleanly via JavaScript below to ensure consistent structure -->
        </main>

        <!-- Footer -->
        <footer class="mt-10 pt-6 border-t border-slate-200 text-center text-xs text-slate-400">
            Vocabulary Study Guide • 11 Key Words from &ldquo;Bluebeard&rdquo;
        </footer>

    </div>

    <script>
        // Exact vocabulary list, definitions, and example sentences
        const vocabularyData = [
            {
                number: 1,
                word: "Splendid",
                definition: "Magnificent, very impressive, or grand.",
                examples: [
                    "The king wore a splendid cloak made of velvet and gold thread.",
                    "We had a splendid view of the ocean from our hotel balcony."
                ]
            },
            {
                number: 2,
                word: "Diseases",
                definition: "Illnesses or sicknesses that affect people, animals, or plants.",
                examples: [
                    "Modern medicine has helped wipe out many dangerous diseases.",
                    "Washing your hands frequently helps prevent the spread of infectious diseases."
                ]
            },
            {
                number: 3,
                word: "Bizarre",
                definition: "Very unusual, strange, or odd.",
                examples: [
                    "We heard a bizarre noise coming from the attic in the middle of the night.",
                    "The movie had a bizarre plot that left everyone confused at the end."
                ]
            },
            {
                number: 4,
                word: "Bunch",
                definition: "A collection of things of the same kind held or grouped together.",
                examples: [
                    "She bought a fresh bunch of bananas from the local market.",
                    "He handed me a large bunch of keys to open all the storage rooms."
                ]
            },
            {
                number: 5,
                word: "Instructions",
                definition: "Detailed directions or orders on how to do or use something.",
                examples: [
                    "Please read the assembly instructions carefully before building the desk.",
                    "The teacher gave clear instructions on how to complete the science project."
                ]
            },
            {
                number: 6,
                word: "Forbidden",
                definition: "Not allowed or strictly prohibited by rule, law, or authority.",
                examples: [
                    "Entering the construction site without a hard hat is strictly forbidden.",
                    "Eating candy before dinner was forbidden in her house."
                ]
            },
            {
                number: 7,
                word: "Curiosity",
                definition: "A strong desire to know or learn about something.",
                examples: [
                    "Out of pure curiosity, she looked inside the mysterious wrapped box.",
                    "Children often ask many questions because of their natural curiosity about the world."
                ]
            },
            {
                number: 8,
                word: "Discovered",
                definition: "Found something hidden, unknown, or unexpected.",
                examples: [
                    "The scientists discovered a new species of frog deep in the rainforest.",
                    "When I opened the dusty drawer, I discovered my long-lost childhood diary."
                ]
            },
            {
                number: 9,
                word: "Burst",
                definition: "To break open, split, or fly apart suddenly and with force.",
                examples: [
                    "The water balloon grew too large and finally burst with a loud pop.",
                    "Strong winds caused the old wooden door to burst open during the storm."
                ]
            },
            {
                number: 10,
                word: "Property",
                definition: "Land, buildings, or possessions owned by someone.",
                examples: [
                    "Walking onto private property without permission is against the law.",
                    "They invested a lot of money into buying residential property downtown."
                ]
            },
            {
                number: 11,
                word: "Wealth",
                definition: "A large amount of valuable possessions, money, or resources.",
                examples: [
                    "He accumulated great wealth through his successful technology business.",
                    "True wealth is measured not just in money, but in health, family, and happiness."
                ]
            }
        ];

        // Populate the grid with clean, structured study cards
        function renderStudyCards() {
            const container = document.getElementById('cards-container');
            if (!container) return;

            const cardsHTML = vocabularyData.map(item => `
                <article class="study-card bg-white rounded-2xl border border-slate-200/90 shadow-sm p-6 flex flex-col justify-between transition-shadow hover:shadow-md">
                    <div>
                        <!-- Card Header: Number Badge & Vocabulary Word -->
                        <div class="flex items-center gap-3 mb-3">
                            <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-bold border border-indigo-100 shrink-0">
                                ${item.number}
                            </span>
                            <h2 class="text-xl font-bold text-slate-900 tracking-tight">
                                ${item.word}
                            </h2>
                        </div>

                        <!-- Definition Section -->
                        <div class="mb-4 pb-4 border-b border-slate-100">
                            <span class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Definition</span>
                            <p class="text-slate-700 font-medium leading-relaxed">
                                ${item.definition}
                            </p>
                        </div>
                    </div>

                    <!-- Examples Section -->
                    <div>
                        <span class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Examples</span>
                        <ul class="space-y-2 text-sm text-slate-600">
                            <li class="flex items-start gap-2">
                                <span class="text-indigo-500 font-bold select-none">&bull;</span>
                                <span class="leading-relaxed">${item.examples[0]}</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <span class="text-indigo-500 font-bold select-none">&bull;</span>
                                <span class="leading-relaxed">${item.examples[1]}</span>
                            </li>
                        </ul>
                    </div>
                </article>
            `).join('');

            container.innerHTML = cardsHTML;
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', renderStudyCards);
    </script>
</body>
</html>
