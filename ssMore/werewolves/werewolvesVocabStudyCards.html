    <meta charset="UTF-8">

    <style>
        * {

            margin: 0;
            padding: 0;
        }

        body {

            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1300px;
            width: 100%;
        }

        h1 {

            font-weight: 400;
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;

            border-bottom: 2px dashed #5e4b3c;
            padding-bottom: 0.6rem;
        }

            color: #e8b88a;
        }

        .subhead {
            text-align: center;
            color: #a08d7c;
            margin-top: -0.2rem;
            margin-bottom: 2.5rem;
            font-style: italic;
            font-size: 0.95rem;

            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));

            justify-content: center;
        }

            color: #ede7e0;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 22px 34px -10px #0a0705, 0 0 0 2px #a77b5e;
        }

        .word {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f4d3b0;
            line-height: 1.1;
            margin-bottom: 0.3rem;
            border-left: 4px solid #b8865b;
            padding-left: 0.9rem;
            text-shadow: 0 2px 3px #0b0805;
        }

        .context-hint {
            font-size: 0.75rem;
            color: #a08d7c;
            margin-left: 1.2rem;
            margin-bottom: 0.5rem;
            font-style: italic;
        }

        .definition {
            font-size: 1.02rem;
            background: #2a222a;
            padding: 0.9rem 1.2rem;
            border-radius: 24px 8px 24px 8px;
            margin: 0.5rem 0 1.2rem 0;
            line-height: 1.5;
            border-left: 2px solid #b17d54;
            color: #ddd2c6;
        }

        .definition strong {
            color: #eac9a8;
            font-weight: 500;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin: 0.6rem 0 0.9rem 0;
            color: #7f6a58;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, #5e4b3c, #2f241d, #5e4b3c);
        }

        .examples {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin-top: 0.2rem;
        }

        .example {
            background: #14101a;
            border-radius: 20px 6px 20px 6px;
            padding: 0.75rem 1.1rem;
            font-size: 0.95rem;
            line-height: 1.5;
            border-left: 3px solid #78604b;
            color: #cfc3b7;
        }

        .example::before {
            content: "› ";
            color: #b48b64;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            background: #2d1f1a;
            color: #cfb094;
            font-size: 0.7rem;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            align-self: flex-start;
            margin-top: 0.7rem;
            border: 1px solid #4b372b;
        }

            body { padding: 1rem 0.8rem; }
            .card-grid { grid-template-columns: 1fr; }
            .word { font-size: 2rem; }
        }

            margin-top: 3rem;
            color: #6b5b4c;
            font-size: 0.9rem;
            border-top: 1px solid #342a24;
            padding-top: 1.8rem;
            text-align: center;
            width: 100%;

    </style>
</head>
