                });

        // ---------------------------------------------------------------
        // Helper: get 2 random distractors (different from the correct word)
        // ---------------------------------------------------------------
        function getDistractors(correctWord, excludeWords = []) {
            const allWords = vocabData.map(item => item.word);
            const pool = allWords.filter(w => w !== correctWord && !excludeWords.includes(w));
            // Shuffle and pick 2
            const shuffled = pool.sort(() => Math.random() - 0.5);
            return shuffled.slice(0, 2);
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';

            allQuestions.forEach((q, index) => {
                const distractors = getDistractors(q.word);
                // Combine correct word + distractors, then shuffle
                const options = [q.word, ...distractors];
                const shuffledOptions = options.sort(() => Math.random() - 0.5);

                // Build the sentence with a select placeholder
                // Split on "__" (placeholder)
                const parts = q.sentence.split('__');
                const before = parts[0] || '';
                const after = parts[1] || '';

                // Generate select options
                let optionsHtml = `<option value="">choices</option>`;
                shuffledOptions.forEach(opt => {
                    optionsHtml += `<option value="${opt}">${opt}</option>`;
                });

                const selectId = `select-${index}`;

                html += `
                    <div class="question-block" data-index="${index}">
                        <span class="question-number">#${index + 1}</span>
                        <span class="sentence-text">
                            <span class="before">${before}</span>
                            <select id="${selectId}" data-index="${index}" class="word-select">
                                ${optionsHtml}
                            </select>
                            <span class="after">${after}</span>
                            <span class="feedback-icon" id="feedback-${index}"></span>
                        </span>
                    </div>
                `;
            });

            container.innerHTML = html;

                    const selectedValue = this.value;
                    const correctWord = allQuestions[index].word;

                    // Reset feedback

                        // User selected "choices" (empty value)
                        this.className = 'word-select';
                        feedbackSpan.textContent = '';
                        answerState[index] = null;
                    } else if (selectedValue === correctWord) {
                        this.className = 'word-select correct';
                        feedbackSpan.textContent = '✅';
                        answerState[index] = 'correct';
                    } else {
                        this.className = 'word-select incorrect';
                        feedbackSpan.textContent = '❌';
                        answerState[index] = 'incorrect';
                    }

                    updateProgress();
                });
            });

            // Initialize answerState
            answerState = new Array(totalQuestions).fill(null);
            updateProgress();

        // Set to correct answer
        select.value = correctWord;
        select.className = 'word-select correct';
        feedbackSpan.textContent = '✅';
        answerState[index] = 'correct';
    });

    updateProgress();
}

// ---------------------------------------------------------------
// Return to Quiz: restore previously captured state
// ---------------------------------------------------------------
function returnToQuiz() {
    if (savedState.length === 0) {
        // No saved state - do nothing
        console.log('No saved state to restore');
        return;
    }

    const selects = document.querySelectorAll('.word-select');

    selects.forEach((select, index) => {
        if (savedState[index]) {
            select.value = savedState[index].value;
            select.className = savedState[index].className;
            document.getElementById(`feedback-${index}`).textContent = savedState[index].feedback;

            // Update answerState based on restored value
            const correctWord = allQuestions[index].word;
            const selectedValue = select.value;

            if (selectedValue === '') {
                answerState[index] = null;
            } else if (selectedValue === correctWord) {
                answerState[index] = 'correct';
            } else {
                answerState[index] = 'incorrect';
            }
        }
    });

    // Reset study mode flag
    isStudyModeActive = false;
    updateProgress();
}

// ---------------------------------------------------------------
document.getElementById('checkAllBtn').textContent = '📖 Study Mode';
document.getElementById('resetAllBtn').textContent = '🔙 Return to Quiz';

// Remove old listeners and add new ones
const checkBtn = document.getElementById('checkAllBtn');
const resetBtn = document.getElementById('resetAllBtn');

// Clone and replace to remove old event listeners
const newCheckBtn = checkBtn.cloneNode(true);
const newResetBtn = resetBtn.cloneNode(true);
checkBtn.parentNode.replaceChild(newCheckBtn, checkBtn);
resetBtn.parentNode.replaceChild(newResetBtn, resetBtn);

newCheckBtn.addEventListener('click', studyMode);
newResetBtn.addEventListener('click', returnToQuiz);
