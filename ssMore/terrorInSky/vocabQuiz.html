<body>
    <div class="container">
        <h1>Terror at 16,000 Feet - Vocab Sentences</h1>
        <p class="subtitle">Select the correct word or phrase to complete each sentence</p>

        <div class="controls">
            <button id="studyBtn" class="btn btn-study" onclick="studyMode()">Study Mode</button>
            <button id="hideBtn" class="btn btn-hide" onclick="returnToQuiz()" style="display: none;">Return to Quiz</button>
        </div>

            <div class="dark-mode-control">
                <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
                <label for="darkModeToggle" style="background:#800080; color: white; margin-bottom:.7rem">&nbsp; Dark Mode &nbsp;</label>
            </div>

        <div id="sentences"></div>
    </div>

    <style>
        .student-info-container{
        max-width:30rem;
        margin: 2rem auto;
        background:#E6F2EE;
        padding: 2rem;
        border-radius: 6px;
        box-shadow: 0 0 2px 5px gray;

        }
        #pdfButton{
            padding:.7rem;
            border-radius:6px;
            font-weight:bold;
        }
        .inputZ{
            padding: .3rem;
            border-radius: 6px;
        }
    </style>


    <div class="student-info-container">
        <div class="input-group">
            <input type="text" id="studentName" class="inputZ" value="Name" maxlength="25">
            <input type="text" id="studentID" value="ID" class="inputZ" maxlength="25">
        </div>
        <p class="note">Name and ID required for Print/Save PDF.</p>
        <button id="pdfButton" class="pdf-button">Print/Save as PDF</button>
    </div>


    <script>
        const nameInput = document.getElementById('studentName');
        const idInput = document.getElementById('studentID');
        const pdfButton = document.getElementById('pdfButton');

        // Placeholder text shown in the empty fields
        const DEFAULTS = { name: 'Name', id: 'ID' };

        // A field counts only if it was changed from its default and has 2+ characters
        function isFilled(input, defaultValue) {
            const value = input.value.trim();
            return value !== defaultValue && value.length >= 2;
        }

        // Clear the placeholder text when a field gets focus, restore it if left empty
        function bindPlaceholder(input, defaultValue) {
            input.addEventListener('focus', function () {
                if (this.value === defaultValue) this.value = '';
            });
            input.addEventListener('blur', function () {
                this.value = this.value.trim() || defaultValue;
            });
        }

        bindPlaceholder(nameInput, DEFAULTS.name);
        bindPlaceholder(idInput, DEFAULTS.id);

        pdfButton.addEventListener('click', function () {
            if (!isFilled(nameInput, DEFAULTS.name) || !isFilled(idInput, DEFAULTS.id)) {
                alert('Name and ID required for Print/Save PDF');
                return;
            }
            window.print();
        });
    </script>

    <script>
        const vocab = [
  {
    "word": "little did they know",
    "sentence": "_____ that their quiet neighbor was a famous writer."
  },
  {
    "word": "blew out",
    "sentence": "The tire _____ while we were driving on the highway."
  },
  {
    "word": "chaos",
    "sentence": "When the fire alarm went off, the school hallway was in _____."
  },
  {
    "word": "oxygen masks",
    "sentence": "The flight attendant showed us how to put on our _____."
  },
  {
    "word": "close call",
    "sentence": "The car stopped just inches from the child. It was a _____."
  },
  {
    "word": "cockpit",
    "sentence": "The pilot invited the young boy to visit the _____ after landing."
  },
  {
    "word": "kept a cool head",
    "sentence": "When the kitchen caught fire, the chef _____ and used the extinguisher."
  },
  {
    "word": "no time to lose",
    "sentence": "The train leaves in five minutes, so there's _____."
  },
  {
    "word": "reassure",
    "sentence": "The doctor tried to _____ her that the test results were normal."
  },
  {
    "word": "composure",
    "sentence": "He lost his _____ and started shouting at the referee."
  },
  {
    "word": "ordeal",
    "sentence": "Being lost in the forest for two days was a terrible _____."
  },
  {
    "word": "burst into tears",
    "sentence": "When she heard she had passed the exam, she _____ of joy."
  },
  {
    "word": "mechanical failure",
    "sentence": "The bus was delayed because of a _____ in the engine."
  },
  {
    "word": "bolts",
    "sentence": "He tightened the _____ on the bicycle wheel before the race."
  },
  {
    "word": "maintenance",
    "sentence": "The elevator is closed today for _____."
  },
  {
    "word": "inspection",
    "sentence": "Every car must pass a safety _____ before it can be sold."
  },
  {
    "word": "negligence",
    "sentence": "The hospital was sued for _____ after the wrong medicine was given."
  },
  {
    "word": "quality control",
    "sentence": "Good _____ means fewer broken toys reach the stores."
  },
  {
    "word": "stricter",
    "sentence": "After the cheating scandal, the school introduced _____ exam rules."
  }
];

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function getDistractors(correctWord, allWords, count = 3) {
            const distractors = allWords.filter(w => w !== correctWord);
            const shuffled = shuffleArray(distractors);
            return shuffled.slice(0, count);
        }

        function createSelect(correctWord, index) {
            const allWords = vocab.map(v => v.word);
            const distractors = getDistractors(correctWord, allWords, 3);
            const options = [correctWord, ...distractors];
            const shuffledOptions = shuffleArray(options);

            let select = `<select id="select-${index}" data-correct="${correctWord}" onchange="checkAnswer(${index})">`;
            select += `<option value="">--select--</option>`;
            shuffledOptions.forEach(option => {
                select += `<option value="${option}">${option}</option>`;
            });
            select += `</select>`;

            return select;
        }

        function renderSentences() {
            const container = document.getElementById('sentences');
            let html = '';

            vocab.forEach((item, index) => {
                const sentenceWithSelect = item.sentence.replace('_____', createSelect(item.word, index));
                html += `<div class="sentence-item">${sentenceWithSelect}</div>`;
            });

            container.innerHTML = html;
        }

        function checkAnswer(index) {
            const select = document.getElementById(`select-${index}`);
            const selectedValue = select.value;
            const correctValue = select.getAttribute('data-correct');

            if (selectedValue === '') {
                select.className = '';
            } else if (selectedValue === correctValue) {
                select.className = 'correct';
            } else {
                select.className = 'incorrect';
            }
        }

        let savedSelections = [];

        // ---- Study Mode / Return to Quiz ----
        function studyMode() {
            savedSelections = vocab.map((item, index) => {
                const select = document.getElementById(`select-${index}`);
                return { value: select.value, className: select.className };
            });

            vocab.forEach((item, index) => {
                const select = document.getElementById(`select-${index}`);
                const correctValue = select.getAttribute('data-correct');
                select.value = correctValue;
                select.className = 'correct';
            });

            document.getElementById('studyBtn').style.display = 'none';
            document.getElementById('hideBtn').style.display = 'block';
        }

        function returnToQuiz() {
            vocab.forEach((item, index) => {
                const select = document.getElementById(`select-${index}`);
                const saved = savedSelections[index];
                if (saved) {
                    select.value = saved.value;
                    select.className = saved.className;
                } else {
                    select.value = '';
                    select.className = '';
                }
            });
            savedSelections = [];

            document.getElementById('hideBtn').style.display = 'none';
            document.getElementById('studyBtn').style.display = 'block';
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        renderSentences();
    </script>
    <footer>...</footer>
</body>
