<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ella and Alli: A Modern-Day Tale of Sisterhood - Vocabulary Cards</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #f0f0f0;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #e94560;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
        }
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .vocab-card {
            background: linear-gradient(145deg, #2d2d44, #252536);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #39395a;
        }
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #e94560;
        }
        .card-closed {
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #e94560;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-open {
            padding: 0;
            display: none;
        }
        .card-header {
            background-color: #e94560;
            color: white;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
        }
        .card-content {
            padding: 15px;
        }
        .definition {
            margin-bottom: 15px;
            line-height: 1.6;
            color: #ccccdd;
        }
        .example {
            background-color: rgba(233, 69, 96, 0.1);
            border-left: 4px solid #e94560;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            line-height: 1.6;
            color: #aaccff;
        }
        .example-title {
            font-weight: bold;
            color: #e94560;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #ff5773;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #8888aa;
            font-size: 0.9rem;
        }
        .hint {
            text-align: center;
            margin-bottom: 20px;
            color: #8888aa;
            font-style: italic;
        }
body.light-mode {
    background-color: #f8f9fa;
    color: #1d1d1f;
}
body.light-mode h1 {
    color: #1e40af;
    text-shadow: 0 0 8px rgba(30, 64, 175, 0.25);
}
body.light-mode .vocab-card {
    background: linear-gradient(145deg, #ffffff, #f0f5ff);
    border: 1px solid #dbeafe;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}
body.light-mode .vocab-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    border-color: #3b82f6;
}
body.light-mode .card-closed {
    color: #1e40af;
}
body.light-mode .card-header {
    background-color: #1e40af;
    color: white;
}
body.light-mode .definition {
    color: #1E40AF;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 20px;
    background-color: rgba(59, 130, 246, 0.10);
    padding: .2rem .3rem;
    border-radius: 0 10px 10px 0;
    border-left: 5px solid #3b82f6;
}
body.light-mode .example {
    border-left: 5px solid #3b82f6;
    padding: 16px 18px 16px 22px;
    border-radius: 0 10px 10px 0;
    color: #1e293b;
    line-height: 1.65;
    font-size: 1.08rem;
    font-weight: 500;
    margin: 16px 0;
}
body.light-mode .example-title {
    color: #1d4ed8;
}
body.light-mode button {
    background-color: #1d4ed8;
    color: white;
}
body.light-mode button:hover {
    background-color: #3b82f6;
}
body.light-mode .hint,
body.light-mode footer {
    color: #4b5563;
}
body.dark-mode {
    background-color: #1a1a2e;
    color: #f0f0f0;
}
body.dark-mode h1 {
    color: #e94560;
    text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
}
    </style>
</head>
<body>
    <h1>Ella and Alli: A Modern-Day Tale of Sisterhood Vocabulary Cards</h1>
    <div class="hint">Click on any card to reveal the definition and example. Click again to close it.</div>

    <div class="controls">
        <button id="openAll">Open All Cards</button>
        <button id="closeAll">Close All Cards</button>
        <button id="themeToggle">Switch to Dark Mode</button>
    </div>

    <div class="cards-container" id="cardsContainer">
        <!-- Cards will be generated by JavaScript -->
    </div>

    <footer>
        Vocabulary extracted from "Ella and Alli: A Modern-Day Tale of Sisterhood" text | Created for learning purposes
    </footer>

    <script>
        const vocabulary = [{"word": "naive", "definition": "Lacking experience or judgment; too willing to trust others without question.", "example": "The naive intern believed every promise the salesman made, even the obviously false ones."}, {"word": "rebellious", "definition": "Resisting authority, rules, or control; defiant.", "example": "The rebellious teenager dyed her hair blue the week after her school banned bright colors."}, {"word": "suffocated", "definition": "Felt trapped or unable to breathe freely; often used to describe feeling overwhelmed by pressure.", "example": "He felt completely suffocated by his parents' constant phone calls checking on his every move."}, {"word": "bully", "definition": "Mean-spirited control over a weaker person.", "example": "Danny bullied Sam every morning, taking Sam's lunch money and pushing him to the ground."}, {"word": "discipline", "definition": "Training that develops self-control and obedience to rules.", "example": "Years of military discipline taught her to wake up at five every morning without an alarm."}, {"word": "tame", "definition": "To make a wild or unruly person or animal calmer and easier to control.", "example": "The new coach hoped strict practice schedules would tame the team's chaotic playing style."}, {"word": "strict", "definition": "Demanding that rules be obeyed; allowing little or no deviation.", "example": "The strict librarian refused to let anyone talk above a whisper."}, {"word": "spoiled", "definition": "Having one's character negatively affected by being given whatever one wants.", "example": "The spoiled puppy refused to eat anything except food from his owner's plate."}, {"word": "devoted", "definition": "Very loving, loyal, or dedicated to someone.", "example": "Her devoted assistant answered emails at midnight without ever being asked."}, {"word": "tragic", "definition": "Causing or marked by extreme distress or sorrow, often due to a disaster.", "example": "The tragic house fire left the whole family searching for a new place to live."}, {"word": "pushed to the sidelines", "definition": "Made to feel unimportant or ignored; excluded from attention or involvement.", "example": "After the new manager arrived, longtime employees felt pushed to the sidelines during meetings."}, {"word": "con-artist", "definition": "A person who tricks others out of money through lies and false charm.", "example": "The con-artist convinced dozens of retirees to invest in a company that didn't exist."}, {"word": "scams", "definition": "Dishonest schemes designed to trick people, usually to steal their money.", "example": "Police warned residents about phone scams targeting elderly homeowners."}, {"word": "paparazzi", "definition": "Photographers from the press who follow famous people everywhere to take pictures of them.", "example": "The paparazzi climbed trees to get a picture of the celebrity lounging at her backyard pool."}, {"word": "fueled", "definition": "Made a feeling or situation grow stronger or more intense.", "example": "Rising ticket prices fueled fans' anger toward the stadium owners."}, {"word": "steal her spotlight", "definition": "To take attention away from someone who should be the center of focus.", "example": "The bride was furious when her sister tried to steal her spotlight at the wedding."}, {"word": "investigate", "definition": "To carry out research or a formal inquiry into a crime or problem.", "example": "Detectives were sent to investigate the mysterious disappearance of the company's funds."}, {"word": "turned south", "definition": "Suddenly got much worse.", "example": "The business deal turned south the moment the investors discovered the missing paperwork."}, {"word": "humiliated", "definition": "Made to feel ashamed or foolish in front of others.", "example": "He felt completely humiliated after tripping on stage in front of the entire school."}, {"word": "manipulated", "definition": "Controlled or influenced someone unfairly for personal gain.", "example": "The salesman manipulated the elderly couple into signing a contract they didn't understand."}, {"word": "evidence", "definition": "Facts or information that prove something is true.", "example": "The lawyer presented new evidence that changed the outcome of the trial."}, {"word": "fraud", "definition": "The crime of deceiving someone to illegally gain money or property.", "example": "The accountant was arrested for tax fraud after years of falsifying records."}, {"word": "victim", "definition": "A person who is harmed or tricked as a result of a crime.", "example": "The charity offers support to victims of identity theft."}, {"word": "confession", "definition": "A statement admitting that one has committed a crime or done something wrong.", "example": "After hours of questioning, the suspect finally gave a full confession."}, {"word": "lost his temper", "definition": "Became suddenly and openly angry.", "example": "The coach lost his temper when the referee made another questionable call."}, {"word": "lunged", "definition": "Made a sudden forceful forward movement, often to attack or grab something.", "example": "The dog lunged at the mail carrier the moment the gate opened."}, {"word": "gullible", "definition": "Too willing to believe things; easily tricked.", "example": "The gullible shopper paid full price after the salesman claimed the item was one-of-a-kind."}, {"word": "pawn", "definition": "A person used by others to achieve their own purposes, with little control themselves.", "example": "The young employee realized too late that he had only been a pawn in his boss's scheme."}, {"word": "dropped all charges", "definition": "Officially ended legal accusations against someone.", "example": "After new witnesses came forward, prosecutors dropped all charges against the wrongly accused man."}];

        function createCards() {
            const container = document.getElementById('cardsContainer');

            vocabulary.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.dataset.word = item.word;

                const closedDiv = document.createElement('div');
                closedDiv.className = 'card-closed';
                closedDiv.textContent = item.word;

                const openDiv = document.createElement('div');
                openDiv.className = 'card-open';

                const header = document.createElement('div');
                header.className = 'card-header';
                header.textContent = item.word;

                const content = document.createElement('div');
                content.className = 'card-content';

                const definition = document.createElement('div');
                definition.className = 'definition';
                definition.innerHTML = `<strong>Definition:</strong> ${item.definition}`;

                const example = document.createElement('div');
                example.className = 'example';
                example.innerHTML = `<div class="example-title">Example</div>${item.example}`;

                content.appendChild(definition);
                content.appendChild(example);

                openDiv.appendChild(header);
                openDiv.appendChild(content);

                card.appendChild(closedDiv);
                card.appendChild(openDiv);

                card.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;

                    const isOpen = this.querySelector('.card-open').style.display === 'block';

                    if (isOpen) {
                        this.querySelector('.card-open').style.display = 'none';
                        this.querySelector('.card-closed').style.display = 'flex';
                    } else {
                        this.querySelector('.card-open').style.display = 'block';
                        this.querySelector('.card-closed').style.display = 'none';
                    }
                });

                container.appendChild(card);
            });
        }

        function openAllCards() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.querySelector('.card-open').style.display = 'block';
                card.querySelector('.card-closed').style.display = 'none';
            });
        }

        function closeAllCards() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.querySelector('.card-open').style.display = 'none';
                card.querySelector('.card-closed').style.display = 'flex';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            createCards();

            document.getElementById('openAll').addEventListener('click', openAllCards);
            document.getElementById('closeAll').addEventListener('click', closeAllCards);
        });
    </script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const body = document.body;
    const toggleBtn = document.getElementById('themeToggle');

    body.classList.add('light-mode');
    toggleBtn.textContent = 'Switch to Dark Mode';

    toggleBtn.addEventListener('click', function() {
        if (body.classList.contains('light-mode')) {
            body.classList.remove('light-mode');
            body.classList.add('dark-mode');
            toggleBtn.textContent = 'Switch to Light Mode';
        } else {
            body.classList.remove('dark-mode');
            body.classList.add('light-mode');
            toggleBtn.textContent = 'Switch to Dark Mode';
        }
    });
});
</script>
</body>
</html>
