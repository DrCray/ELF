<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mave and Laura: A True Sacrifice - Vocabulary Cards</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #f0f0f0;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #e94560;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
        }
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .vocab-card {
            background: linear-gradient(145deg, #2d2d44, #252536);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #39395a;
        }
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #e94560;
        }
        .card-closed {
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #e94560;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-open {
            padding: 0;
            display: none;
        }
        .card-header {
            background-color: #e94560;
            color: white;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
        }
        .card-content {
            padding: 15px;
        }
        .definition {
            margin-bottom: 15px;
            line-height: 1.6;
            color: #ccccdd;
        }
        .example {
            background-color: rgba(233, 69, 96, 0.1);
            border-left: 4px solid #e94560;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            line-height: 1.6;
            color: #aaccff;
        }
        .example-title {
            font-weight: bold;
            color: #e94560;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #ff5773;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #8888aa;
            font-size: 0.9rem;
        }
        .hint {
            text-align: center;
            margin-bottom: 20px;
            color: #8888aa;
            font-style: italic;
        }
body.light-mode {
    background-color: #f8f9fa;
    color: #1d1d1f;
}
body.light-mode h1 {
    color: #1e40af;
    text-shadow: 0 0 8px rgba(30, 64, 175, 0.25);
}
body.light-mode .vocab-card {
    background: linear-gradient(145deg, #ffffff, #f0f5ff);
    border: 1px solid #dbeafe;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}
body.light-mode .vocab-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    border-color: #3b82f6;
}
body.light-mode .card-closed {
    color: #1e40af;
}
body.light-mode .card-header {
    background-color: #1e40af;
    color: white;
}
body.light-mode .definition {
    color: #1E40AF;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 20px;
    background-color: rgba(59, 130, 246, 0.10);
    padding: .2rem .3rem;
    border-radius: 0 10px 10px 0;
    border-left: 5px solid #3b82f6;
}
body.light-mode .example {
    border-left: 5px solid #3b82f6;
    padding: 16px 18px 16px 22px;
    border-radius: 0 10px 10px 0;
    color: #1e293b;
    line-height: 1.65;
    font-size: 1.08rem;
    font-weight: 500;
    margin: 16px 0;
}
body.light-mode .example-title {
    color: #1d4ed8;
}
body.light-mode button {
    background-color: #1d4ed8;
    color: white;
}
body.light-mode button:hover {
    background-color: #3b82f6;
}
body.light-mode .hint,
body.light-mode footer {
    color: #4b5563;
}
body.dark-mode {
    background-color: #1a1a2e;
    color: #f0f0f0;
}
body.dark-mode h1 {
    color: #e94560;
    text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
}
    </style>
</head>
<body>
    <h1>Mave and Laura: A True Sacrifice Vocabulary Cards</h1>
    <div class="hint">Click on any card to reveal the definition and example. Click again to close it.</div>

    <div class="controls">
        <button id="openAll">Open All Cards</button>
        <button id="closeAll">Close All Cards</button>
        <button id="themeToggle">Switch to Dark Mode</button>
    </div>

    <div class="cards-container" id="cardsContainer">
        <!-- Cards will be generated by JavaScript -->
    </div>

    <footer>
        Vocabulary extracted from "Mave and Laura: A True Sacrifice" text | Created for learning purposes
    </footer>

    <script>
        const vocabulary = [{"word": "possessed", "definition": "Had or owned a quality, ability, or thing.", "example": "The old violin possessed a warm, rich tone that modern instruments rarely have."}, {"word": "transform", "definition": "To change something completely in form or appearance.", "example": "A splash of paint can transform a plain room into something vibrant."}, {"word": "prank", "definition": "A playful trick played on someone, usually harmless.", "example": "The students planned a prank for the last day of school."}, {"word": "slipped from", "definition": "Fell or dropped out of someone's grasp unexpectedly.", "example": "The wet plate slipped from his hands and shattered on the floor."}, {"word": "landed on", "definition": "Fell or came down onto a particular spot.", "example": "The heavy book landed on her toe and made her cry out."}, {"word": "restored", "definition": "Brought something back to its original or healthy condition.", "example": "The doctor's treatment restored her strength within a few weeks."}, {"word": "fueled by", "definition": "Made stronger or more powerful by something.", "example": "His determination was fueled by memories of his grandfather's advice."}, {"word": "permanently", "definition": "In a way that lasts forever; unable to be changed back.", "example": "The accident permanently damaged the antique clock's mechanism."}, {"word": "withdrew from", "definition": "Removed oneself from a place, activity, or group.", "example": "She withdrew from the competition after spraining her ankle."}, {"word": "inseparable", "definition": "So closely connected that two things or people cannot be parted.", "example": "The twins were inseparable, doing everything together since childhood."}, {"word": "magnificent", "definition": "Extremely beautiful, elaborate, or impressive.", "example": "The hotel's magnificent lobby featured a marble staircase and crystal chandeliers."}, {"word": "proposed", "definition": "Asked someone to marry them.", "example": "He proposed to her on a rooftop overlooking the city lights."}, {"word": "rushing into", "definition": "Doing something too quickly, without enough thought or preparation.", "example": "Friends warned him he was rushing into buying a house he hadn't even seen."}, {"word": "spiraled out of control", "definition": "Became increasingly difficult to manage until control was lost entirely.", "example": "The small argument spiraled out of control and ended their friendship."}, {"word": "feast", "definition": "A large, elaborate meal, often prepared for a special occasion.", "example": "The whole village gathered for a feast after the harvest."}, {"word": "fled", "definition": "Ran away quickly from danger or a difficult situation.", "example": "The frightened deer fled into the forest at the sound of the gunshot."}, {"word": "Determined to", "definition": "Having made a firm decision to do something, despite difficulty.", "example": "Determined to finish the marathon, she kept running even after twisting her ankle."}, {"word": "overcome", "definition": "Overwhelmed by a strong emotion.", "example": "She was overcome with joy when she saw her family waiting at the airport."}, {"word": "no clue", "definition": "No idea or understanding at all about something.", "example": "He had no clue how to fix the leaking pipe."}, {"word": "paralyzed by fear", "definition": "So frightened that one is unable to move or act.", "example": "Paralyzed by fear, the hiker froze when the bear appeared on the trail."}, {"word": "crept", "definition": "Moved slowly and carefully, often without being noticed.", "example": "A chill crept up her spine as the room grew darker."}, {"word": "conquered her fear", "definition": "Successfully overcame something that had been frightening.", "example": "After months of therapy, she finally conquered her fear of flying."}, {"word": "flesh", "definition": "The soft part of a body, made of muscle and fat, covering the bones.", "example": "The wound healed, and new flesh slowly covered the scar."}, {"word": "vanished", "definition": "Disappeared suddenly and completely.", "example": "The magician waved his hand, and the coin vanished into thin air."}, {"word": "wept", "definition": "Cried, usually because of strong emotion.", "example": "The old man wept quietly at his wife's grave."}, {"word": "sacrificed", "definition": "Gave up something valuable for the sake of someone or something else.", "example": "The firefighter sacrificed his own safety to rescue the child from the burning building."}];

        function createCards() {
            const container = document.getElementById('cardsContainer');

            vocabulary.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.dataset.word = item.word;

                const closedDiv = document.createElement('div');
                closedDiv.className = 'card-closed';
                closedDiv.textContent = item.word;

                const openDiv = document.createElement('div');
                openDiv.className = 'card-open';

                const header = document.createElement('div');
                header.className = 'card-header';
                header.textContent = item.word;

                const content = document.createElement('div');
                content.className = 'card-content';

                const definition = document.createElement('div');
                definition.className = 'definition';
                definition.innerHTML = `<strong>Definition:</strong> ${item.definition}`;

                const example = document.createElement('div');
                example.className = 'example';
                example.innerHTML = `<div class="example-title">Example</div>${item.example}`;

                content.appendChild(definition);
                content.appendChild(example);

                openDiv.appendChild(header);
                openDiv.appendChild(content);

                card.appendChild(closedDiv);
                card.appendChild(openDiv);

                card.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;

                    const isOpen = this.querySelector('.card-open').style.display === 'block';

                    if (isOpen) {
                        this.querySelector('.card-open').style.display = 'none';
                        this.querySelector('.card-closed').style.display = 'flex';
                    } else {
                        this.querySelector('.card-open').style.display = 'block';
                        this.querySelector('.card-closed').style.display = 'none';
                    }
                });

                container.appendChild(card);
            });
        }

        function openAllCards() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.querySelector('.card-open').style.display = 'block';
                card.querySelector('.card-closed').style.display = 'none';
            });
        }

        function closeAllCards() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.querySelector('.card-open').style.display = 'none';
                card.querySelector('.card-closed').style.display = 'flex';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            createCards();

            document.getElementById('openAll').addEventListener('click', openAllCards);
            document.getElementById('closeAll').addEventListener('click', closeAllCards);
        });
    </script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const body = document.body;
    const toggleBtn = document.getElementById('themeToggle');

    body.classList.add('light-mode');
    toggleBtn.textContent = 'Switch to Dark Mode';

    toggleBtn.addEventListener('click', function() {
        if (body.classList.contains('light-mode')) {
            body.classList.remove('light-mode');
            body.classList.add('dark-mode');
            toggleBtn.textContent = 'Switch to Light Mode';
        } else {
            body.classList.remove('dark-mode');
            body.classList.add('light-mode');
            toggleBtn.textContent = 'Switch to Dark Mode';
        }
    });
});
</script>
</body>
</html>
